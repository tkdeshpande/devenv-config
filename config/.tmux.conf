# =============================================================================
# tmux configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Core
# -----------------------------------------------------------------------------

# Set default terminal with 256-color and true color (24-bit) support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Increase scrollback buffer (default is 2000)
set -g history-limit 50000

# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------

# Split windows at current working directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"


# -----------------------------------------------------------------------------
# Copy mode (vi)
# -----------------------------------------------------------------------------
setw -g mode-keys vi


# -----------------------------------------------------------------------------
# Mouse
# -----------------------------------------------------------------------------
set -g mouse on

# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------

set -g status on
set -g status-interval 5          # Refresh every 5 seconds
set -g status-position bottom

# Colours
set -g status-style "fg=#a8b0c8,bg=#1a1b26"
